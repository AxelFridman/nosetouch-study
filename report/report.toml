# Settings of the report's asset step (scripts/make_assets.py) and the deck builder (presentation/build_deck.py).
# Paths are relative to this file.

[predictor]
# The one canonical predictor link: every QR code (report, PI sheet, deck) is generated from it.
# The Stage 3 inference page is not built yet; the link is the planned one.
url = "https://axelfridman.github.io/nosetouch-study/?predict=1"

[runs]
# The Stage 2 analysis outputs (git-ignored; they exist only on the machine that ran the analysis):
# figures/<unit>/ + captions.json, tables/<unit>/*.tex, results/<unit>_numbers.json.
stage2 = "../analysis/reports/stage2"
# The analysis package (its stage2.report_export formats the numbers exactly as the generated tables do).
analysis = "../analysis"

[cache]
# The Stage 2 cache metadata: its data identity goes into the provenance line of every page.
meta = "../analysis/data/stage2_cache/meta.json"

[build]
# "draft": a missing input becomes a grey box or a red ??key. "final": the asset step and LaTeX stop instead.
# Override with REPORT_MODE=final.
mode = "draft"
